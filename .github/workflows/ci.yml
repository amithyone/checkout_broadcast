name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install jsonschema

      - name: Run tests
        env:
          PYTHONPATH: sdk/python:.
        run: pytest tests/ -v

      - name: Verify bank API starts
        env:
          PYTHONPATH: sdk/python:.
          CHECKOUT_BANK_ADMIN_KEY: ci-admin-key-min-16-chars
        run: |
          python -m uvicorn bank_api.server:app --host 127.0.0.1 --port 8090 &
          sleep 2
          curl -sf http://127.0.0.1:8090/health
          curl -sf http://127.0.0.1:8090/ready

  android-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and unit-test Android SDK
        working-directory: sdk/android
        run: ./gradlew :checkout-broadcast:assembleRelease :checkout-broadcast:testReleaseUnitTest --console=plain

  ios-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Swift package (macOS)
        working-directory: sdk/ios/CheckoutBroadcast
        run: swift test

      - name: Build Swift package for iOS
        working-directory: sdk/ios/CheckoutBroadcast
        run: swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios15.0
